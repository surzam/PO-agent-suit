<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PO Agent Suite</title><link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <main id="app" class="app-shell">
    <header class="app-head"><div class="brand"><b>PO</b> AGENT <em>SUITE</em></div><nav id="runTabs" class="run-tabs" hidden><button data-view="result" class="active">Результат</button><button data-view="observation">Наблюдение</button></nav><button id="windowControl" class="window-control" aria-label="Закрыть">×</button></header>
    <section id="start" class="screen start-screen active"><div class="start-copy"><p>БЕСКОНЕЧНЫЙ РАКУРС</p><h1>Следующая история ещё не существует</h1></div><div id="customChat" class="custom-chat" hidden><div id="messages" class="messages"><div class="message agent">Опишите вопрос. Ваш ракурс останется главным, а исследование найдёт для него проверяемую опору.</div></div><textarea id="prompt" placeholder="Что нужно исследовать?"></textarea></div></section>
    <section id="result" class="screen result-screen"><div id="resultBody" class="result-body"><p class="eyebrow">Результат</p><h2 id="resultTitle">AgentSuite начинает работу</h2><p id="resultStatus">Откройте Наблюдение, чтобы увидеть Runtime.</p><div id="resultArtifacts" class="artifact-actions" aria-label="Результаты запуска"></div><div id="resultNavigation" class="result-navigation"><button id="resultObservation">Наблюдение</button><button id="cancelRun" hidden>Отменить</button><button id="newGeneration">Новая генерация</button><button id="copyDiagnostics" class="secondary">Диагностика</button></div><button id="ctoFork" class="secondary cto-fork" hidden>Посмотреть глазами CTO</button></div></section>
    <section id="observation" class="screen observation-screen"></section>
    <section id="artifact" class="artifact-screen" hidden><header class="artifact-toolbar"><button id="artifactBack" class="artifact-back" aria-label="Назад">←</button><div><small>РЕЗУЛЬТАТ</small><strong id="artifactTitle">Артефакт</strong></div><button id="artifactClose" class="artifact-close" aria-label="Вернуться назад">Назад</button></header><div class="artifact-viewport"><article id="artifactContent" class="artifact-content"></article><iframe id="artifactFrame" class="artifact-frame" sandbox="allow-scripts" title="Презентация"></iframe></div></section>
    <footer id="startControls" class="start-controls"><div class="intent-tabs"><button id="randomMode" class="active">Случайное</button><button id="customMode">Свой вопрос</button></div><button id="generate" class="generate">ГЕНЕРИРОВАТЬ</button></footer>
  </main>
  <!-- Compatibility audit markers: Research sequence · LIVE JOB · applyStyle(x.visualTheme)
       data-family="editorial" data-family="arcade" data-family="brutal" data-family="playful" data-family="diagrammatic" data-family="cinematic" -->
  <script type="module" src="/ui/app.js"></script>
  <script>window.__PO_AGENT_UI__={version:"R13.5"};</script>
</body></html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PO Agent Suite · Workstation Computer</title>
  <style>
    :root{--bg:#071321;--ink:#f7fbff;--accent:#8ff1df;--soft:#527086;--hot:#ff805d;--font-display:Inter;--font-body:Inter;--font-mono:monospace;--turn:0deg}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:var(--bg);color:var(--ink);font-family:var(--font-body),sans-serif;transition:background .8s,color .8s}
    .stage{min-height:100vh;display:grid;place-items:center;position:relative;padding:8vw;isolation:isolate;-webkit-app-region:drag}.stage::before,.stage::after{content:"";position:absolute;z-index:-1;pointer-events:none;transition:.8s}
    .brand{display:none}
    .close{position:fixed;z-index:20;top:22px;right:26px;width:42px;height:42px;border:1px solid color-mix(in srgb,var(--ink),transparent 60%);border-radius:50%;background:transparent;color:var(--ink);font:300 28px/36px system-ui;cursor:pointer;-webkit-app-region:no-drag;transition:.25s}.close:hover{background:var(--hot);border-color:var(--hot);color:var(--bg);transform:rotate(90deg)}
    .brand b{color:var(--hot)}.brand i{font-style:normal;color:var(--ink)}
    .title{max-width:1050px;text-align:center;font:900 clamp(32px,6vw,92px)/.9 var(--font-display),serif;letter-spacing:-.07em;transform:rotate(var(--turn));transition:all .8s}.title .role{color:var(--hot)}.title .workstation,.title .computer{display:block;font-size:.58em;letter-spacing:.16em;line-height:1.05}.title .workstation{margin-top:.55em}.title .computer{color:var(--accent)}.ready .brand{display:none}
    .mark{position:absolute;top:7vh;right:7vw;color:var(--accent);font:clamp(20px,3vw,44px) var(--font-mono),monospace;transform:rotate(var(--turn));transition:all .8s}
    .controls{position:fixed;z-index:10;bottom:max(28px,6vh);left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:calc(100vw - 40px);-webkit-app-region:no-drag}
    .button,.artifact{border:1px solid color-mix(in srgb,var(--ink),transparent 45%);background:transparent;color:var(--ink);font:700 12px var(--font-mono),monospace;padding:14px 18px;cursor:pointer;transition:.3s;-webkit-app-region:no-drag}
    .button{background:var(--accent);border-color:var(--accent);color:var(--bg);min-width:170px}.button:hover,.artifact:hover{background:var(--hot);border-color:var(--hot);color:var(--bg)}.button:disabled{opacity:.82;cursor:wait}.artifact{display:none;text-decoration:none}.ready .artifact{display:block}.loading .title{opacity:.2}
    [hidden]{display:none!important}#artifacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    body[data-family="editorial"] .stage{background:repeating-linear-gradient(90deg,transparent 0 79px,color-mix(in srgb,var(--soft) 24%,transparent) 80px)}body[data-family="editorial"] .stage::before{inset:5vh 5vw;border-block:1px solid var(--soft)}body[data-family="editorial"] .title{font-style:italic;font-weight:600;letter-spacing:-.045em}body[data-family="editorial"] .button,body[data-family="editorial"] .artifact{border-width:0 0 1px;border-radius:0;background:transparent;color:var(--ink);text-transform:uppercase}body[data-family="editorial"] .button{color:var(--accent)}
    body[data-family="arcade"] .stage{background:repeating-linear-gradient(0deg,transparent 0 5px,#0002 6px),radial-gradient(circle at 75% 30%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 40%)}body[data-family="arcade"] .stage::before{inset:4vh 4vw;border:8px solid var(--accent);box-shadow:8px 8px 0 var(--hot),inset 0 0 42px color-mix(in srgb,var(--accent) 25%,transparent)}body[data-family="arcade"] .title{text-transform:uppercase;text-shadow:7px 7px 0 color-mix(in srgb,var(--hot) 58%,transparent)}body[data-family="arcade"] .button,body[data-family="arcade"] .artifact{border:3px solid var(--accent);border-radius:0;box-shadow:6px 6px 0 var(--hot)}
    body[data-family="brutal"] .stage{background:linear-gradient(135deg,transparent 0 78%,var(--accent) 78%)}body[data-family="brutal"] .stage::before{left:5vw;top:6vh;width:28vw;height:18px;background:var(--ink)}body[data-family="brutal"] .title{text-align:left;margin-right:auto;text-transform:uppercase}body[data-family="brutal"] .button,body[data-family="brutal"] .artifact{border:4px solid var(--ink);border-radius:0;box-shadow:7px 7px 0 var(--hot);font-weight:900}
    body[data-family="playful"] .stage{background:radial-gradient(circle at 10% 85%,var(--accent) 0 9vw,transparent 9.2vw),radial-gradient(circle at 90% 14%,var(--hot) 0 12vw,transparent 12.2vw)}body[data-family="playful"] .stage::before{width:22vw;height:22vw;left:13vw;top:10vh;border:3px dashed var(--soft);border-radius:50%;transform:rotate(14deg)}body[data-family="playful"] .title{transform:rotate(-2deg)}body[data-family="playful"] .button,body[data-family="playful"] .artifact{border:2px solid var(--ink);border-radius:999px}body[data-family="playful"] .artifact:nth-child(even){transform:rotate(2deg)}
    body[data-family="diagrammatic"] .stage{background-image:linear-gradient(color-mix(in srgb,var(--soft) 44%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--soft) 44%,transparent) 1px,transparent 1px);background-size:48px 48px}body[data-family="diagrammatic"] .stage::before{left:7vw;right:7vw;top:18vh;border-top:3px solid var(--accent)}body[data-family="diagrammatic"] .stage::after{top:calc(18vh - 7px);right:7vw;width:14px;height:14px;border-radius:50%;background:var(--hot)}body[data-family="diagrammatic"] .title{font-weight:600}body[data-family="diagrammatic"] .button,body[data-family="diagrammatic"] .artifact{background:var(--bg);border-color:var(--accent);border-radius:0}
    body[data-family="cinematic"] .stage{background:radial-gradient(circle at 72% 35%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 44%),linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--bg) 78%,#000))}body[data-family="cinematic"] .stage::before{width:62vw;height:62vw;border:1px solid color-mix(in srgb,var(--soft) 42%,transparent);border-radius:50%;left:43vw;top:-20vw}body[data-family="cinematic"] .title{font-size:clamp(42px,7vw,110px);font-weight:500}body[data-family="cinematic"] .button,body[data-family="cinematic"] .artifact{backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 66%,transparent);border-radius:2px}
    body[data-variant="1"] .title{text-align:left;margin-right:auto;max-width:850px}body[data-variant="2"] .title{text-align:right;margin-left:auto}body[data-variant="3"] .stage{box-shadow:inset 24px 0 0 var(--hot)}body[data-variant="4"] .button,body[data-variant="4"] .artifact{border-style:dashed}body[data-variant="5"] .title{font-style:italic}
    body.waiting{background:radial-gradient(circle at 50% 38%,#263b52 0,#101c2b 42%,#071321 100%)}body.waiting .stage{background:none}body.waiting .stage::before,body.waiting .stage::after{display:none}body.waiting .title{opacity:1;text-align:center;margin:auto;transform:none;text-shadow:none;font-style:normal;text-transform:none}body.waiting .button{min-width:220px;border:1px solid #8ff1df;box-shadow:none;border-radius:0;background:#8ff1df;color:#071321}
    @media(max-width:650px){.brand{top:28px;left:20px}.mark{top:30px;right:20px}.controls{bottom:28px;flex-direction:column}.title{font-size:clamp(36px,12vw,90px)}}
  </style>
</head>
<body class="loading"><main class="stage"><div class="brand"><b>PO</b><i> Agent Suite · Workstation Computer</i></div><div class="mark">✦ ◌ ↗</div><div class="title" id="title"><span class="role">PO</span> Agent Suite <span class="workstation">WORKSTATION</span><span class="computer">COMPUTER</span></div><div class="controls"><button class="button" id="run">Генерировать</button><div id="artifacts"><a class="artifact" id="data" target="_blank" rel="noopener">Data</a><a class="artifact" id="narrative" target="_blank" rel="noopener">Narrative</a><a class="artifact" id="slides" target="_blank" rel="noopener">Slides</a><a class="artifact" id="pptx" download>⬇ PPTX LEGACY</a></div></div></main>
<script>
const $=s=>document.querySelector(s);const fullTitle='PO Agent Suite · Workstation Computer';const loadingTitle='<span class="role">PO</span> Agent Suite <span class="workstation">WORKSTATION</span><span class="computer">COMPUTER</span>';let lastMotto='Следующий ракурс';
const closeButton=document.createElement('button');closeButton.className='close';closeButton.type='button';closeButton.setAttribute('aria-label','Закрыть');closeButton.textContent='×';closeButton.onclick=()=>{if(window.poDesktop?.close)window.poDesktop.close();else window.close()};document.body.append(closeButton);
function applyStyle(theme){if(!theme?.colors)return;const root=document.documentElement;for(const [name,value] of Object.entries(theme.colors))root.style.setProperty(`--${name}`,value);root.style.setProperty('--font-display',`'${theme.typography.display}'`);root.style.setProperty('--font-body',`'${theme.typography.body}'`);root.style.setProperty('--font-mono',`'${theme.typography.mono}'`);let font=$('#presentation-font');if(theme.fontUrl){if(!font){font=document.createElement('link');font.id='presentation-font';font.rel='stylesheet';document.head.append(font)}font.href=theme.fontUrl}else if(font)font.remove();document.body.dataset.family=theme.family;document.body.dataset.variant=theme.variant;document.body.dataset.template=theme.styleId;document.body.className='ready'}
async function generate(){const b=$('#run');b.disabled=true;b.textContent='Генерирую новый ракурс…';$('#artifacts').hidden=true;document.body.className='waiting';$('#title').innerHTML=loadingTitle;try{const r=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}),x=await r.json();if(!r.ok)throw Error(x.error||'generation failed');applyStyle(x.visualTheme);lastMotto=x.narrative?.motto||x.narrative?.centralThesis||lastMotto;$('#title').textContent=lastMotto;for(const k of ['data','narrative','slides','pptx'])$('#'+k).href=x.urls[k];$('#artifacts').hidden=false;b.textContent='Генерировать ещё'}catch(e){document.body.className='waiting';$('#title').innerHTML=loadingTitle;console.error(e)}finally{b.disabled=false}}
$('#run').onclick=generate;setTimeout(generate,300);
</script></body></html>

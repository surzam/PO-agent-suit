<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentSuite</title><style>
:root{color-scheme:dark;--bg:#101216;--panel:#191c23;--line:#303541;--muted:#9aa3b2;--accent:#8dd3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f4f8;font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1,h2,h3{margin:0 0 10px;line-height:1.15}button,select{background:#252a34;border:1px solid var(--line);color:inherit;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:var(--accent);color:#0c1717;border:0;font-weight:700}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel,.run-card,.artifact{background:var(--panel);border:1px solid var(--line);border-radius:12px}.panel{padding:16px}.run-card{padding:14px;margin:8px 0;cursor:pointer}.run-card:hover,.run-card.active{border-color:var(--accent)}.muted{color:var(--muted)}.tag{display:inline-block;color:var(--accent);font-size:12px;margin-right:8px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.artifact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.artifact{padding:12px}.artifact a,.link{color:var(--accent);cursor:pointer}.timeline{border-left:1px solid var(--line);padding-left:14px}.event{margin:8px 0}.branch{border-left:2px solid var(--accent);padding:8px 12px;margin:8px 0}.claim{padding:10px 0;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;overflow:auto;background:#0c0e12;padding:12px;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);text-align:left;padding:7px} @media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:18px 12px}}
</style></head><body><main><header><div><div class="muted">LOCAL RUNTIME</div><h1>AgentSuite</h1></div><div class="toolbar"><select id="role"></select><select id="workflow"></select><button class="primary" id="newRun">Новый Run</button></div></header><div class="layout"><aside class="panel"><h2>Runs</h2><div id="runs">Загрузка…</div></aside><section class="panel" id="detail"><div class="muted">Выберите Run слева</div></section></div></main><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null,roles=[];
async function get(url){const r=await fetch(url);const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}async function load(){const [r,rs,w]=await Promise.all([get('/api/runs'),get('/api/roles'),get('/api/workflows')]);roles=rs.roles;$('#role').innerHTML=roles.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('');$('#workflow').innerHTML=w.workflows.map(x=>`<option>${esc(x)}</option>`).join('');$('#runs').innerHTML=r.runs.length?r.runs.map(x=>`<div class="run-card" data-id="${x.id}"><b>${esc(x.intent)}</b><div><span class="tag">${esc(x.role)}</span><span class="muted">${esc(x.status)}</span></div>${x.parentRunId?`<small class="muted">forked from ${esc(x.parentRunId)}</small>`:''}${x.demo?'<small class="muted">Demo fixture · explicitly synthetic</small>':''}</div>`).join(''):'<div class="muted">Пока нет Runs</div>';document.querySelectorAll('.run-card').forEach(x=>x.onclick=()=>show(x.dataset.id))}function roleView(id){const r=roles.find(x=>x.id===id);return r?`<div class="muted">Priorities</div><div>${r.priorities.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}
async function show(id){current=await get('/api/runs/'+id);const a=current.artifacts;$('#detail').innerHTML=`<div class="toolbar"><div><div class="muted">Intent</div><h2>${esc(current.intent)}</h2><span class="tag">${esc(current.role)}</span> <span class="muted">${esc(current.status)} · ${esc(current.workflow)}</span></div><button id="cto">View as another Role</button></div><div class="branch"><h3>Worldview · ${esc(current.role)}</h3>${roleView(current.role)}</div>${current.parentRunId?`<p class="muted">Parent Run: ${esc(current.parentRunId)}</p>`:''}<h3>Artifacts</h3><div class="artifact-grid">${a.map(x=>`<div class="artifact"><b>${esc(x.type)}</b><div class="muted">${(x.reused?'reused · ':'')}${esc(x.id)}</div><a data-art="${x.id}">Открыть</a><div class="muted">${(x.sourceArtifactIds||[]).length?'← '+x.sourceArtifactIds.map(id=>esc(id)).join(', '):''}</div></div>`).join('')}</div><h3>Timeline</h3><div class="timeline">${current.events.map(e=>`<div class="event"><b>${esc(e.type)}</b><div class="muted">${esc(e.at)} ${e.payload?.message?`· ${esc(e.payload.message)}`:''}</div></div>`).join('')}</div>`;document.querySelectorAll('[data-art]').forEach(x=>x.onclick=()=>artifact(x.dataset.art));$('#cto').onclick=()=>{const other=roles.find(r=>r.id!==current.role);if(other)rerun(other.id)};}
async function artifact(id){const x=await get('/api/artifacts/'+id);$('#detail').insertAdjacentHTML('beforeend',`<h3>Artifact · ${esc(x.type)}</h3><pre>${esc(JSON.stringify(x.data,null,2))}</pre>`)}async function rerun(role){const x=await fetch('/api/runs/'+current.id+'/rerun',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,from:'synthesis'})});const v=await x.json();if(!x.ok)alert(v.error);else{await load();await show(v.id)}}$('#newRun').onclick=async()=>{const intent=prompt('Intent');if(!intent)return;const x=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent,role:$('#role').value,workflow:$('#workflow').value})});const v=await x.json();if(!x.ok)alert(v.error);else{await load();show(v.id)}};load().catch(e=>$('#runs').textContent=e.message);
</script></body></html>
